name: Verify

# Guards the one failure mode this repo is prone to: someone edits the generated
# HTML in the site root by hand, or edits _src/ and forgets to rebuild. Both
# produce a working-looking commit that the next `build.py` run silently undoes.
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python: GitHub's Ubuntu runners ship Python 3, and both scripts
      # are stdlib-only. Adding a setup step would imply a dependency we do not have.
      - name: Generated HTML is up to date
        run: python3 tools/build.py --check

      - name: No broken internal links
        run: python3 tools/check_links.py

      # The capability statement states the same facts as the site. It drifted
      # once already — advertising a retired contract vehicle and a capability
      # page that no longer existed — so agreement is enforced rather than
      # remembered. Checks the committed PDF matches the generator, and that
      # the vehicles, practices, UEI, CAGE and NAICS codes match the built site.
      - name: Capability statement is current and agrees with the site
        run: python3 tools/build_capability_statement.py --check

      # The SEWP ordering guide is a contract deliverable with a maintenance
      # clock on it, so a stale committed PDF is a compliance problem rather
      # than an inconvenience. This only checks the file matches the
      # generator; PDF/UA conformance needs verapdf, which is not installed
      # on the runner - see the note in the script.
      - name: SEWP ordering guide is current
        run: python3 tools/build_sewp_ordering_guide.py --check
